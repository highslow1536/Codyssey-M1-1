<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">PC Parts Observatory</title>
  <desc id="desc">가격 기록을 관측하고, 같은 조건에서 비교하고, 미래 예측을 검증하는 흐름.</desc>
  <defs>
    <linearGradient id="background" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop stop-color="#112822"/>
      <stop offset="1" stop-color="#1b3e34"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#94c9b4" opacity=".23"/>
    </pattern>
    <clipPath id="edge"><rect width="1120" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="1120" height="320" fill="url(#background)"/>
    <path d="M553 0h567v320H553z" fill="url(#dots)"/>
    <path d="M585 44v232" stroke="#416558" stroke-width="1"/>
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif">
      <rect x="55" y="49" width="12" height="12" rx="3" fill="#b4efb9"/>
      <text x="80" y="60" fill="#b4efb9" font-size="14" font-weight="700" letter-spacing="3">PC PARTS OBSERVATORY</text>
      <text x="53" y="139" fill="#f7fbf3" font-size="50" font-weight="800" letter-spacing="-1.6">가격의 흐름을 읽다</text>
      <text x="55" y="192" fill="#d1e8da" font-size="25" font-weight="550">구매 판단의 근거를 검증하다</text>
      <path d="M55 224h465" stroke="#416558"/>
      <text x="55" y="264" fill="#b3cfc0" font-size="16" font-weight="650" letter-spacing="2.2">CPU  /  RAM  /  SSD  /  GPU</text>
      <g transform="translate(628 44)">
        <rect width="436" height="68" rx="13" fill="#24493d" stroke="#507468"/>
        <rect x="14" y="14" width="42" height="40" rx="8" fill="#345d4e"/>
        <text x="35" y="40" text-anchor="middle" fill="#b4efb9" font-size="15" font-weight="750">01</text>
        <text x="74" y="41" fill="#f7fbf3" font-size="21" font-weight="700">가격 기록</text>
        <text x="414" y="40" text-anchor="end" fill="#c6e1d3" font-size="13" font-weight="700" letter-spacing="1.8">OBSERVE</text>
      </g>
      <g transform="translate(628 126)">
        <rect width="436" height="68" rx="13" fill="#24493d" stroke="#507468"/>
        <rect x="14" y="14" width="42" height="40" rx="8" fill="#345d4e"/>
        <text x="35" y="40" text-anchor="middle" fill="#b4efb9" font-size="15" font-weight="750">02</text>
        <text x="74" y="41" fill="#f7fbf3" font-size="21" font-weight="700">제품·시장 비교</text>
        <text x="414" y="40" text-anchor="end" fill="#c6e1d3" font-size="13" font-weight="700" letter-spacing="1.8">COMPARE</text>
      </g>
      <g transform="translate(628 208)">
        <rect width="436" height="68" rx="13" fill="#24493d" stroke="#507468"/>
        <rect x="14" y="14" width="42" height="40" rx="8" fill="#dceeb6"/>
        <text x="35" y="40" text-anchor="middle" fill="#17362a" font-size="15" font-weight="750">03</text>
        <text x="74" y="41" fill="#f7fbf3" font-size="21" font-weight="700">3개월 예측 검증</text>
        <text x="414" y="40" text-anchor="end" fill="#dceeb6" font-size="13" font-weight="700" letter-spacing="1.8">VALIDATE</text>
      </g>
    </g>
  </g>
</svg>
